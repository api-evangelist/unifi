name: Unifi
description: >-
  Unifi Software was a self-service data platform built around an enterprise
  data catalog, with AI-based recommendations, data discovery, and data
  preparation tools aimed at business users. A Canaan Partners seed investment
  (led by Maha Ibrahim), the company was acquired by Dell Boomi, which
  announced its intent to acquire Unifi Software's data catalog and
  preparation technology in December 2019; by mid-2020 the Unifi site had been
  folded into Boomi. Its former domains no longer host the product —
  unifisoftware.com does not resolve and unifiyourdata.com is parked at
  Safenames — so no public API surface remains to catalog.
